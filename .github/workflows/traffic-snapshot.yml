name: Traffic Snapshot

# Captures GitHub traffic metrics daily and stores them long-term.
# GitHub's native traffic API only retains the last 14 days, so this
# workflow appends each day's data to metrics/traffic_history.jsonl and
# regenerates a human-readable metrics/SUMMARY.md.
#
# Runs entirely on GitHub-hosted runners — no local machine needed.
#
# Setup (one-time):
#   1. Create a fine-grained Personal Access Token (PAT) with:
#      - Repository access: this repo
#      - Permissions: Administration (Read), Contents (Read and Write)
#   2. Add it as a repo secret named TRAFFIC_TOKEN:
#      Settings → Secrets and variables → Actions → New repository secret

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 08:00 UTC
  workflow_dispatch: {}    # Allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Capture traffic metrics
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p metrics
          DATE=$(date -u +%Y-%m-%d)

          # Fetch traffic data (14-day windows; we snapshot today's totals)
          CLONES=$(gh api "repos/$REPO/traffic/clones" 2>/dev/null || echo '{}')
          VIEWS=$(gh api "repos/$REPO/traffic/views" 2>/dev/null || echo '{}')

          # Extract the most recent day's counts (yesterday is the last complete day)
          CLONES_TOTAL=$(echo "$CLONES" | jq '.count // 0')
          CLONES_UNIQUE=$(echo "$CLONES" | jq '.uniques // 0')
          VIEWS_TOTAL=$(echo "$VIEWS" | jq '.count // 0')
          VIEWS_UNIQUE=$(echo "$VIEWS" | jq '.uniques // 0')

          # Append today's 14-day rolling totals as one JSONL record.
          # Storing the full API response daily lets us dedupe by date later.
          jq -c -n \
            --arg date "$DATE" \
            --argjson clones_total "$CLONES_TOTAL" \
            --argjson clones_unique "$CLONES_UNIQUE" \
            --argjson views_total "$VIEWS_TOTAL" \
            --argjson views_unique "$VIEWS_UNIQUE" \
            --argjson clones_raw "$CLONES" \
            --argjson views_raw "$VIEWS" \
            '{date: $date, clones_total_14d: $clones_total, clones_unique_14d: $clones_unique, views_total_14d: $views_total, views_unique_14d: $views_unique, clones_daily: ($clones_raw.clones // []), views_daily: ($views_raw.views // [])}' \
            >> metrics/traffic_history.jsonl

          # --- Rebuild a merged daily series (dedupe by day across snapshots) ---
          # Each snapshot contains up to 14 days of per-day data. We union all
          # per-day records across every snapshot, keeping the last-seen value
          # for each date, then compute 90-day rollups.
          jq -s '
            [.[].clones_daily[]] as $all_clones
            | [.[].views_daily[]] as $all_views
            | ($all_clones | map({(.timestamp[0:10]): {c: .count, cu: .uniques}}) | add // {}) as $cmap
            | ($all_views  | map({(.timestamp[0:10]): {v: .count, vu: .uniques}}) | add // {}) as $vmap
            | ($cmap | keys) + ($vmap | keys) | unique | sort as $dates
            | $dates
            | map({
                date: .,
                clones: ($cmap[.].c // 0),
                clones_unique: ($cmap[.].cu // 0),
                views: ($vmap[.].v // 0),
                views_unique: ($vmap[.].vu // 0)
              })
          ' metrics/traffic_history.jsonl > metrics/daily_merged.json

          # --- Generate SUMMARY.md ---
          CUTOFF=$(date -u -d '90 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-90d +%Y-%m-%d)

          TOTALS=$(jq --arg cutoff "$CUTOFF" '
            map(select(.date >= $cutoff))
            | {
                clones: (map(.clones) | add // 0),
                clones_unique: (map(.clones_unique) | add // 0),
                views: (map(.views) | add // 0),
                views_unique: (map(.views_unique) | add // 0),
                days: length
              }
          ' metrics/daily_merged.json)

          C=$(echo "$TOTALS" | jq '.clones')
          CU=$(echo "$TOTALS" | jq '.clones_unique')
          V=$(echo "$TOTALS" | jq '.views')
          VU=$(echo "$TOTALS" | jq '.views_unique')
          DAYS=$(echo "$TOTALS" | jq '.days')

          {
            echo "# Traffic Summary — Last 90 Days"
            echo ""
            echo "> Auto-generated by \`.github/workflows/traffic-snapshot.yml\`. Last updated: $DATE (UTC)"
            echo ""
            echo "| Metric | 90-Day Total |"
            echo "|--------|-------------:|"
            echo "| Git clones | $C |"
            echo "| Unique cloners | $CU |"
            echo "| Page views | $V |"
            echo "| Unique visitors | $VU |"
            echo ""
            echo "_Based on $DAYS days of captured data. GitHub's native API only retains 14 days, so history begins when this workflow was first enabled._"
            echo ""
            echo "## Recent Daily Activity (last 30 days)"
            echo ""
            echo "| Date | Clones | Unique | Views | Unique |"
            echo "|------|-------:|-------:|------:|-------:|"
            jq -r 'sort_by(.date) | reverse | .[0:30] | .[] | "| \(.date) | \(.clones) | \(.clones_unique) | \(.views) | \(.views_unique) |"' metrics/daily_merged.json
          } > metrics/SUMMARY.md

          rm -f metrics/daily_merged.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- metrics/; then
            echo "No metric changes to commit."
            exit 0
          fi
          git add metrics/traffic_history.jsonl metrics/SUMMARY.md
          git commit -m "chore: daily traffic snapshot $(date -u +%Y-%m-%d)"
          git push
